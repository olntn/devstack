# Изоляция корневой ФС (ОПЦИОНАЛЬНО). Подключается ПОВЕРХ compose.yaml, только
# если в .env стоит DEVSTACK_READONLY_ROOT=1. В модели free-agent по
# умолчанию ВЫКЛЮЧЕНО — внутри агент свободен и пишет куда угодно. Включай, если
# хочешь дополнительно запретить контейнеру менять свою ОС.
#
# Что делает: корневая файловая система контейнера становится read-only. Значит
# контейнер не может менять собственную ОС/образ и ничего не «прилипает» вне
# смонтированных путей. Записываемыми остаются только:
#   /workspace        — твой проект (bind)
#   /home/dev         — home-состояние (docker-том)
#   /tmp, /run        — эфемерный tmpfs (сбрасывается при рестарте)
# Всё остальное (/usr, /etc, /var ...) — только чтение. Это и есть «изоляция
# от хоста на уровне образа»: процесс внутри не закрепится в системе.
#
# Чем это ограничивает (осознанный размен):
#   - Рантайм-apt через `./devstack root` НЕ работает (нужна запись в /var,/etc).
#     Системные пакеты ставь через EXTRA_APT + ./devstack rebuild.
#   - `npm i -g` в рантайме не пройдёт (пишет в /usr). Глобальные CLI — на этапе
#     build (AI_CLI_NPM), инструменты — через mise в /home/dev (см. .env.example).
# Нужен временно полный доступ на запись — поставь DEVSTACK_READONLY_ROOT=0 в .env
# и `./devstack down && ./devstack up`.

services:
  dev:
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/tmp
